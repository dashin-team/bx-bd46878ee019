<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Noto Sans TC","Noto Sans CJK TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;background:#eaf3f4;color:#16323d;-webkit-text-size-adjust:100%;min-height:100vh}
[hidden]{display:none!important}
button,input{font:inherit}
/* ---- 登入 ---- */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}

#login input:focus{border-color:#1a9aa0;background:#fff;box-shadow:0 0 0 3px rgba(26,154,160,.15)}
#login button{width:100%;height:48px;border:0;border-radius:12px;background:linear-gradient(135deg,#0f7c86,#1f6fb2);color:#fff;font-size:16px;font-weight:700;cursor:pointer}

#login .fg{display:block;text-align:center;margin-top:14px;font-size:13px;color:#1f6fb2;text-decoration:none}
#ferr{color:#c9302c;font-size:13px;min-height:18px;margin:-6px 0 10px}

.rcbox{font:700 18px/1.6 ui-monospace,Menlo,monospace;letter-spacing:1px;background:#fffbe8;border:1.5px dashed #e0b53a;border-radius:10px;padding:10px;margin:8px 0;word-break:break-all;text-align:center}
#err{min-height:20px;margin:-4px 0 10px;color:#c9302c;font-size:13px;text-align:center}
/* ---- 內容區 ---- */
#bar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid #d8e7e9;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}

.btn{border:0;border-radius:10px;height:36px;padding:0 14px;font-size:14px;font-weight:700;cursor:pointer;background:#e3f3f4;color:#0f7c86;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.btn.pri{background:linear-gradient(135deg,#0f7c86,#1f6fb2);color:#fff}

#view{max-width:560px;margin:0 auto;padding:14px 10px 70px}
#view h1{font-size:21px;margin:8px 4px 2px;font-weight:900}

.mem .r2{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:11.5px;border-radius:10px;padding:2px 10px;background:#e3f3f4;color:#0f7c86;font-weight:700}

.dl{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:2px 4px 12px}

.chip.rv{background:#fff4d6;color:#8a6100}
.note{font-size:12.5px;color:#8a6100;background:#fff9e6;border-radius:12px;padding:8px 12px;margin:0 4px 14px}
.hit{background:#fff2a8;border-radius:3px}
.folder{display:block;background:linear-gradient(135deg,#0f7c86,#1f6fb2);color:#fff;border-radius:18px;padding:14px 16px;margin-bottom:14px;text-decoration:none;box-shadow:0 4px 14px rgba(15,124,134,.28)}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.cd{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 6px rgba(15,124,134,.12);position:relative;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;cursor:zoom-in;padding:0;border:0}

.cd .ph{color:#9db0b6;font-size:11px}

#lb img{margin:auto;width:100%;max-width:none;height:auto;cursor:zoom-in;touch-action:pan-x pan-y pinch-zoom}
#lb img.th{filter:blur(2px);opacity:.8}
#lb.z img{width:230%;cursor:zoom-out;margin:0}
.lbn{position:fixed;top:50%;z-index:51;width:40px;height:56px;margin-top:-28px;border:0;border-radius:12px;background:rgba(255,255,255,.88);font-size:30px;line-height:1;font-weight:700;color:#16323d;cursor:pointer;display:flex;align-items:center;justify-content:center}
#lbp{left:6px}#lbq{right:6px}
.lbn[disabled]{opacity:.25;cursor:default}
#lbc{position:fixed;left:0;right:0;top:max(18px,env(safe-area-inset-top));text-align:center;color:#fff;font-size:13px;font-weight:700;z-index:51;pointer-events:none}
#lbx{position:fixed;right:10px;top:max(10px,env(safe-area-inset-top));z-index:51;width:40px;height:40px;border-radius:20px;border:0;background:rgba(255,255,255,.92);font-size:22px;font-weight:700;color:#16323d;cursor:pointer}
#lbh{position:fixed;left:0;right:0;bottom:8px;text-align:center;color:#cfe0e3;font-size:12px;z-index:51;pointer-events:none}
@media(min-width:600px){#view{padding-top:22px}}
.adm{background:#fff7e0;border:1.5px solid #f0c75e;border-radius:14px;padding:8px 10px;margin:0 0 12px}
.admt{font-size:12.5px;color:#7a5a00;margin-bottom:6px}.admb{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.btn.dang{background:#fde8e4;color:#c9302c}.btn.sm{height:28px;padding:0 10px;font-size:12px}
.card.adf{background:#fff;border-radius:14px;padding:10px 12px;margin:0 0 12px;box-shadow:0 1px 6px rgba(15,124,134,.1)}

.adf input,.adf select,.adf textarea{width:100%;min-width:0;border:1.5px solid #cfe0e3;border-radius:9px;padding:6px 8px;font-size:15px;background:#f9fcfc;color:#16323d}

.adf .ah{font-weight:900;font-size:14px;margin:4px 0 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 8px}
.fl span{display:block;font-size:11px;color:#5b7480;margin-bottom:2px}

.tx{margin:8px 0}.tl2{font-size:13px;font-weight:700;margin-bottom:4px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.man{background:#fde8e4;color:#c9302c;font-size:11px;border-radius:8px;padding:0 6px}.auto{background:#e3f3f4;color:#0f7c86;font-size:11px;border-radius:8px;padding:0 6px}
.rnote2{font-size:11.5px;color:#5b7480;margin:4px 0}.aerr{color:#c9302c;font-size:13px;margin-top:6px}.ph2{font-size:16px;margin:16px 4px 8px}
.stale{font-size:12.5px;color:#8a6100;background:#fff9e6;border-radius:12px;padding:8px 12px;margin:0 4px 12px}
ul.lg{margin:0;padding-left:18px;font-size:12.5px;line-height:1.6}

function trendBlock(C, sums) {
  var by = sums.by_year, age = C.age, ys = [];
  for (var y = BASE_YEAR; y < 2111; y++) if ((by.get(y) || 0) > 0) ys.push(y);
  if (!ys.length) return { bars: [{ range: "目前", amount: 0 }], note: "目前沒有應繳的台幣保費（皆已繳畢、躉繳或僅美元保單）；年齡依保險年齡簡算。" };
  var last = Math.max.apply(null, ys), seg = [];
  for (y = BASE_YEAR; y <= last; y++) { var a = pyRound(by.get(y) || 0); if (seg.length && seg[seg.length - 1][2] === a) seg[seg.length - 1][1] = y; else seg.push([y, y, a]); }
  var merged = false;
  while (seg.length > 7) {
    var best = null, bi = 0;
    for (var i = 0; i < seg.length - 1; i++) { var p = seg[i][2], q = seg[i + 1][2], r = Math.abs(p - q) / Math.max(p, q, 1); if (best === null || r < best) { best = r; bi = i; } }
    seg.splice(bi, 2, [seg[bi][0], seg[bi + 1][1], Math.max(seg[bi][2], seg[bi + 1][2])]); merged = true;
  }
  var bars = seg.map(function (s) { var aa = yrAge(s[0], age), ab = yrAge(s[1], age); return { range: aa === ab ? aa + "歲" : aa + "–" + ab + "歲", amount: int(s[2]) }; });
  if (last < 2110 && yrAge(last + 1, age) <= 105) bars.push({ range: yrAge(last + 1, age) + "歲後", amount: 0 });
  return { bars: bars, note: "依明細頁各項保費與繳費期滿日推算（台幣，美元保單不計入）；" + (merged ? "相近年度已合併、區間取最高年度金額；" : "") + "年齡依保險年齡簡算（2026 年＝" + age + " 歲）。實際以繳費通知為準。" };
}

function groupItems(pairs, age, limit) {

function timelineBlock(C, A) {
  var g = A.g, age = C.age, END = 100, rows = [];
  function mk(name, src, kind, ea, label) { rows.push({ name: name, src: cut(src, 18), kind: kind, end_age: ea, label: label }); }
  function codes(pairs) { var seen = []; pairs.forEach(function (t) { if (seen.indexOf(t[1].code) < 0) seen.push(t[1].code); }); return seen.slice(0, 4).join("・"); }
  function catRows(label, pairs, noneLabel, allowNone) {
    if (!pairs.length) { if (allowNone) mk(noneLabel || label, "目前無", "none", null, "無保障"); return; }
    var lf = pairs.filter(function (t) { return endInfo(t[1], age)[0] === "life"; });
    var tm = pairs.filter(function (t) { return endInfo(t[1], age)[0] === "term"; });
    var un = pairs.filter(function (t) { return endInfo(t[1], age)[0] === "unk"; });
    if (lf.length) mk(label, codes(lf), "life", END, "終身 ▶");
    if (tm.length) {
      var ys = tm.map(function (t) { return yr(t[1].cov_end); }), mny = Math.min.apply(null, ys), mxy = Math.max.apply(null, ys), ea, k, lab;
      if (mny - BASE_YEAR <= 10) { ea = Math.min(END, yrAge(mny, age)); k = "warn"; lab = mny === mxy ? mny + " 到期（" + yrAge(mny, age) + "歲）" : mny + " 起陸續到期（" + yrAge(mny, age) + "歲）"; }
      else { k = "mid"; ea = Math.min(END, yrAge(mxy, age)); lab = mny === mxy ? "至 " + ea + " 歲" : yrAge(mny, age) + "–" + ea + " 歲屆滿"; }
      mk(label + (lf.length ? "（定期）" : ""), codes(tm), k, ea, lab);
    }
    if (un.length && !lf.length && !tm.length) mk(label, codes(un), "yr", END, "期間明細頁未顯示");
  }
  catRows("壽險（終身）", [].concat(g("LIFE"), g("SAVE")));
  catRows("定期壽險", g("TERM"));
  catRows("失能照護", g("DISAB"), "失能／長照", true);
  catRows("失能附約", g("DISAB_R"));
  catRows("重大傷病", g("CRIT"), "重大傷病", true);
  catRows("癌症保障", g("CANCER"), "癌症保障", true);
  catRows("住院醫療", [].concat(g("HOSP"), g("HEALTH"), g("SURG")), "住院醫療", true);
  catRows("意外保障", [].concat(g("ACC_DD"), g("ACC_MED"), g("ACC_HOSP")), "意外保障", true);
  if (g("INV").length) mk("投資型壽險", codes(g("INV")), "yr", END, "依帳戶價值，待確認");
  if (g("ANN").length) mk("年金保險", codes(g("ANN")), "yr", END, "依條款，待確認");
  function drop(pred) { for (var i = rows.length - 1; i >= 0; i--) { if (rows.length <= 11) return; if (pred(rows[i])) rows.splice(i, 1); } }
  drop(function (r) { return r.name === "失能附約"; });
  drop(function (r) { return r.kind === "none" && (r.name === "意外保障" || r.name === "癌症保障"); });
  drop(function (r) { return /（定期）$/.test(r.name) && r.name.indexOf("住院") !== 0; });
  drop(function (r) { return r.kind === "none"; });
  drop(function (r) { return r.kind === "yr"; });
  rows = rows.slice(0, 11);
  var a0 = age, cs = {};
  rows.forEach(function (r) { if ((r.kind === "mid" || r.kind === "warn") && r.end_age && a0 < r.end_age && r.end_age < END) cs[r.end_age] = 1; });
  var cand = Object.keys(cs).map(Number).sort(function (a, b) { return a - b; });
  var wid = 262 / (END - a0), mingap = Math.ceil(36 / wid), ticks = [a0];
  cand.forEach(function (c) { if (c - ticks[ticks.length - 1] >= mingap && (END - c) >= mingap && ticks.length < 4) ticks.push(c); });
  if (END - ticks[ticks.length - 1] >= mingap) ticks.push(END);
  var warn = rows.filter(function (r) { return r.kind === "warn" && ticks.indexOf(r.end_age) >= 0; }).map(function (r) { return r.end_age; });
  var t = { base_year: BASE_YEAR, base_age: a0, end_age: END, ticks: ticks, row_h: 31, rows: rows };
  if (warn.length) t.warn_age = Math.min.apply(null, warn);
  return t;
}

function diffModel(a,b){

  if(a.age!==b.age) out.push('年齡 '+a.age+' → '+b.age);

  if(JSON.stringify(a.hh||null)!==JSON.stringify(b.hh||null)){var hb=b.hh||{}; out.push('家庭責任資料：'+(hb.on?'納入計算':'不計算')+'、成員 '+(hb.members||[]).length+' 位（'+(hb.members||[]).map(function(m){return m.rel+' '+m.age+'歲'+(m.dep?'・扶養'+m.years+'年':'')}).join('、')+'）、年生活費 '+(hb.living||0)+'、房貸 '+(hb.mortgage||0)+'、負債 '+(hb.debt||0))}
  var ka={}; (a.policies||[]).forEach(function(P){ka[P.code]=P}); var kb={}; b.policies.forEach(function(P){kb[P.code]=P});

      Object.keys(x).forEach(function(k){if(JSON.stringify(x[k])!==JSON.stringify(y[k])&&k!=='amt_kind') out.push('…'+P.code+' '+(x.code||x.short)+' '+fl(k)+'：'+fmtv(y[k])+' → '+fmtv(x[k]))});
    }

}
